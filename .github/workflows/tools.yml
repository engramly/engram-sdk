name: Agent tools
on:
  push:
    paths: ["packages/**", "typescript/**", "skills/**", "package.json", "bun.lock"]
  pull_request:
    paths: ["packages/**", "typescript/**", "skills/**", "package.json", "bun.lock"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter '*' build
      - run: bun test
      - run: npm pack --dry-run --workspace packages/cli
      - run: npm pack --dry-run --workspace packages/mcp-server
