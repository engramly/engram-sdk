name: Release npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test
      - run: npm pack --dry-run --workspace typescript
      - run: npm pack --dry-run --workspace packages/cli
      - run: npm pack --dry-run --workspace packages/mcp-server
      - run: npm publish --workspace typescript --provenance
      - run: npm publish --workspace packages/cli --provenance
      - run: npm publish --workspace packages/mcp-server --provenance
